</style></head><body><div id="app">

const MINDS={2300:["The sky is thinning. Command says wait.","We counted three moons. There are two.","Someone watches the camp from behind my eyes.","The sea left our shore. We follow it."],2450:["The domes hum at night. We stopped sleeping.","A tall one walked on water. Nobody spoke of it.","Our maps change while we eat.","Rain tastes of metal now."],2600:["The ring above us is nearly closed. Who builds it?","Tomorrow’s rain fell on us yesterday.","They said the observer was a myth.","Nothing left to harvest, only to remember."]};

const S={bpm:72,breath:0,anch:[],mag:null,back:null,go:null,at:null,left:18000,ts:1,era:2300,prev:2300,bleed:0,dmg:55,psi:100,dys:60,alert:0,veil:0,w:'clear',score:0,sphere:0,tide:0,gain:50,mode:null,tkDir:1,drone:false,over:false,seen:0,minds:0,jumps:0,flash:0,scanCd:0,auto:'semi',bt:2,az:.6,el:.5,tel:false,wind:0};
const SEA=()=>5+S.tide,ci=v=>Math.max(0,Math.min(G-1,Math.floor(v/C))),gh=(x,z)=>Math.max(HT[ci(z)*G+ci(x)],SEA())*V;
let HT=new Int8Array(G*G),SRC=new Uint16Array(G*G),ED=new Int8Array(G*G),camps=[],aliens=[],t=0,tL,tS;
const GREY=new THREE.Color(0x778078);

const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(SW,SH);ren.autoClear=false;$('gl').appendChild(ren.domElement);

function eh(e,x,z){const E=ERAS[e],p=E.ph+seed*.01;return Math.round(5+E.amp*(4*Math.sin(x*.11+p)+3*Math.sin(z*.09+p*2)+2*Math.cos((x+z)*.17+p*3)+1.5*Math.sin(x*.31)*Math.cos(z*.27))+hash(x*31+z*17+e)*1.2)}
// figures
function mkFig(col,fill,big){const g=new THREE.Group(),m=new THREE.MeshBasicMaterial({color:fill}),l=new THREE.LineBasicMaterial({color:col});
[[0,2.7,0,big?1.2:.9,big?1.4:.9,big?1.1:.9],[0,1.5,0,1,1.4,.6],[-.3,.4,0,.4,1,.4],[.3,.4,0,.4,1,.4]].forEach(p=>{const geo=new THREE.BoxGeometry(p[3],p[4],p[5]),b=new THREE.Mesh(geo,m);b.position.set(p[0],p[1],p[2]);const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),l);e.position.copy(b.position);g.add(b,e)});
if(big){const em=new THREE.MeshBasicMaterial({color:0});[-.3,.3].forEach(x=>{const e=new THREE.Mesh(new THREE.BoxGeometry(.3,.15,.1),em);e.position.set(x,2.8,.62);g.add(e)})}return g}
function mkCamp(type,col){const g=new THREE.Group();let geo,y=0;if(type=='tent'){geo=new THREE.ConeGeometry(4,5,4);y=2.5}else if(type=='dome')geo=new THREE.SphereGeometry(4,10,6,0,Math.PI*2,0,Math.PI/2);else{geo=new THREE.CylinderGeometry(1,1.7,18,6);y=9}
const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x010805})),w=new THREE.LineSegments(new THREE.WireframeGeometry(geo),new THREE.LineBasicMaterial({color:col}));m.position.y=w.position.y=y;g.add(m,w);return g}
const hero={x:0,z:0,y:0,lift:0,g:mkFig(0x2dff7a,0x03140a)},ch={x:0,z:0,hot:0,sp:6,g:mkFig(0xff3df2,0x1a0418)},dr={x:0,z:0,g:new THREE.Group()};
{const b=new THREE.BoxGeometry(1.4,.5,1.4);dr.g.add(new THREE.Mesh(b,new THREE.MeshBasicMaterial({color:0x021018})),new THREE.LineSegments(new THREE.EdgesGeometry(b),new THREE.LineBasicMaterial({color:0x35e0ff})));dr.g.visible=false}
scene.add(hero.g,ch.g,dr.g);
const campG=new THREE.Group(),anchG=new THREE.Group();scene.add(campG,anchG);
// water, sphere, stars, rain, beam
const water=new THREE.Mesh(new THREE.PlaneGeometry(G*C,G*C),new THREE.MeshBasicMaterial({color:0x0a3cff,transparent:true,opacity:.22,depthWrite:false}));water.rotation.x=-Math.PI/2;water.position.set(G*C/2,0,G*C/2);scene.add(water);
const grid=new THREE.GridHelper(G*C,32,0x35e0ff,0x0b4a6a);grid.position.set(G*C/2,0,G*C/2);grid.material.transparent=true;grid.material.opacity=.35;scene.add(grid);
const sg=new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(280,3)),sphere=new THREE.LineSegments(sg,new THREE.LineBasicMaterial({color:0xffb02e,transparent:true,opacity:.45,fog:false}));sphere.position.set(G*C/2,0,G*C/2);scene.add(sphere);
{const p=[];for(let i=0;i<500;i++){const a=Math.random()*6.28,b=Math.random()*1.4+.1;p.push(Math.cos(a)*Math.cos(b)*900+96,Math.sin(b)*900,Math.sin(a)*Math.cos(b)*900+96)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xbfffd8,size:2,fog:false})))}
const rp=new Float32Array(900*3);for(let i=0;i<900;i++){rp[i*3]=Math.random()*60-30;rp[i*3+1]=Math.random()*40;rp[i*3+2]=Math.random()*60-30}
const rg=new THREE.BufferGeometry();rg.setAttribute('position',new THREE.BufferAttribute(rp,3));const rain=new THREE.Points(rg,new THREE.PointsMaterial({color:0x9fd8ff,size:.3}));rain.visible=false;rain.frustumCulled=false;scene.add(rain);
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0,0,80,0],3));const beam=new THREE.Line(bg,new THREE.LineBasicMaterial({color:0x35e0ff}));beam.visible=false;beam.frustumCulled=false;scene.add(beam);
const fx=[];function ring(x,y,z,r,col){const m=new THREE.Mesh(new THREE.RingGeometry(.92,1,48),new THREE.MeshBasicMaterial({color:col,transparent:true,side:THREE.DoubleSide,depthTest:false}));m.rotation.x=-Math.PI/2;m.position.set(x,y+.4,z);scene.add(m);fx.push({m,t0:t,r})}
// terrain
const mk=(a,c)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));return g};
function build(){const lp=[],lc=[],sp=[],sc=[],gr=Math.min(.6,S.dmg/170),tc=new THREE.Color();
for(let z=0;z<G;z++)for(let x=0;x<G;x++){const i=z*G+x,h=HT[i],y=h*V,x0=x*C,x1=x0+C,z0=z*C,z1=z0+C;tc.set(ERAS[SRC[i]].col).multiplyScalar(.7+hash(i)*.3).lerp(GREY,gr);const r=tc.r,g=tc.g,b=tc.b;
[[x0,z0,x1,z0],[x1,z0,x1,z1],[x1,z1,x0,z1],[x0,z1,x0,z0]].forEach(e=>{lp.push(e[0],y,e[1],e[2],y,e[3]);lc.push(r,g,b,r,g,b)});
[[x0,z0],[x1,z0],[x1,z1],[x0,z0],[x1,z1],[x0,z1]].forEach(p=>{sp.push(p[0],y,p[1]);sc.push(r*.1,g*.1,b*.1)});
[[1,0,x1,z0,x1,z1],[-1,0,x0,z1,x0,z0],[0,1,x1,z1,x0,z1],[0,-1,x0,z0,x1,z0]].forEach(w=>{const nx=x+w[0],nz=z+w[1],nh=(nx<0||nz<0||nx>=G||nz>=G)?0:HT[nz*G+nx];if(nh>=h)return;const y2=nh*V;
lp.push(w[2],y,w[3],w[2],y2,w[3],w[4],y,w[5],w[4],y2,w[5]);for(let k=0;k<4;k++)lc.push(r*.6,g*.6,b*.6);
[[w[2],y,w[3]],[w[4],y,w[5]],[w[4],y2,w[5]],[w[2],y,w[3]],[w[4],y2,w[5]],[w[2],y2,w[3]]].forEach(p=>{sp.push(p[0],p[1],p[2]);sc.push(r*.08,g*.08,b*.08)})})}

function gen(){for(let z=0;z<G;z++)for(let x=0;x<G;x++){const i=z*G+x;SRC[i]=hash(i*.7+99+S.jumps*13)<S.bleed?S.prev:S.era;HT[i]=Math.max(0,Math.min(MH,eh(SRC[i],x,z)+ED[i]))}
while(campG.children.length)campG.remove(campG.children[0]);$('labels').innerHTML='';camps=[];aliens=[];
for(let k=0;k<10;k++){const cx=9+(k%5)*12+(hash(k*9+S.jumps)*4|0),cz=10+(k/5|0)*28+(hash(k*5+S.jumps)*8|0),s=hash(k*3.1+S.jumps*7)<S.bleed?S.prev:S.era,E=ERAS[s];
for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++){const j=(cz+dz)*G+cx+dx;HT[j]=Math.min(MH,Math.max(HT[j],SEA()+1));SRC[j]=s}
const y=HT[cz*G+cx]*V,x=cx*C+C/2,z=cz*C+C/2,st=mkCamp(E.type,E.col);st.position.set(x,y,z);campG.add(st);

for(let j=0;j<n;j++){const m=MINDS[s],ox=(j-(n-1)/2)*3.4,oz=6+(j%2)*1.5,g=mkFig(s!=S.era?0x35e0ff:0xcfd8dc,0x59646b,true);g.position.set(x+ox,y,z+oz);campG.add(g);const a={x:x+ox,z:z+oz,y,g,read:0,mind:(S.bleed&&hash(k*7+j)<.2)?BLEED[j%2]:m[(k+j)%m.length]};al.push(a);aliens.push(a)}

build();water.position.y=SEA()*V+.05;grid.position.y=SEA()*V+.1}
// log + hud

// tools

$('tools').innerHTML=GR.map(g=>`<div class="grp"><span>${g[0]}</span>${g[1].map(b=>`<button class="${['cams','mic','tel'].includes(b[1])?'':'act'}" data-a="${b[1]}">${b[0]}</button>`).join('')}</div>`).join('');
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(S.auto=='full'&&b.classList.contains('act'))return;act(b.dataset.a,b)});
